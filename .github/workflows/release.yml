name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the build (e.g. v1.0.0-beta)"
        required: false
        default: "dev"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || 'dev' }}

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build bundled VST3 instruments
        shell: pwsh
        run: |
          ./scripts/build_bundled_vsti_windows.ps1 -RepoRoot $PWD -OutputDir (Join-Path $PWD "vsti")

      - name: Package portable Windows build
        shell: pwsh
        run: |
          $archiveOutput = ./scripts/build_windows_release.ps1 -RepoRoot $PWD -PythonExecutable "${{ env.pythonLocation }}\\python.exe" -ReleaseVersion "${{ env.RELEASE_VERSION }}" -SkipBundledVstBuild
          $archivePath = ($archiveOutput | Select-Object -Last 1).ToString().Trim()
          if (-not $archivePath) {
            throw "Packaging step did not return an archive path."
          }
          if (-not (Test-Path $archivePath)) {
            throw "Archive path not found: $archivePath"
          }
          "ARCHIVE_PATH=$archivePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $hash = Get-FileHash -Path $env:ARCHIVE_PATH -Algorithm SHA256
          $checksumPath = "$env:ARCHIVE_PATH.sha256"
          Set-Content -Path $checksumPath -Value "$($hash.Hash.ToLower())  $(Split-Path $env:ARCHIVE_PATH -Leaf)" -Encoding ASCII
          "CHECKSUM_PATH=$checksumPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup -e --accept-package-agreements --accept-source-agreements

      - name: Build Windows installer
        shell: pwsh
        run: |
          $installerOutput = ./scripts/build_windows_installer.ps1 -RepoRoot $PWD -ReleaseVersion "${{ env.RELEASE_VERSION }}"
          $installerPath = ($installerOutput | Select-Object -Last 1).ToString().Trim()
          if (-not $installerPath) {
            throw "Installer step did not return a path."
          }
          if (-not (Test-Path $installerPath)) {
            throw "Installer path not found: $installerPath"
          }
          "INSTALLER_PATH=$installerPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create installer SHA256 checksum
        shell: pwsh
        run: |
          $hash = Get-FileHash -Path $env:INSTALLER_PATH -Algorithm SHA256
          $checksumPath = "$env:INSTALLER_PATH.sha256"
          Set-Content -Path $checksumPath -Value "$($hash.Hash.ToLower())  $(Split-Path $env:INSTALLER_PATH -Leaf)" -Encoding ASCII
          "INSTALLER_CHECKSUM_PATH=$checksumPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Music-Studio-${{ env.RELEASE_VERSION }}-windows-x64
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.CHECKSUM_PATH }}
            ${{ env.INSTALLER_PATH }}
            ${{ env.INSTALLER_CHECKSUM_PATH }}
          if-no-files-found: error

  macos-release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build bundled VST3 instruments
        run: |
          git clone --depth 1 https://github.com/juce-framework/JUCE.git JUCE
          cmake -S plugins/AdvancedVSTi -B plugins/AdvancedVSTi/build-macos \
                -DJUCE_DIR="${GITHUB_WORKSPACE}/JUCE" \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build plugins/AdvancedVSTi/build-macos --config Release

          mkdir -p vsti
          find plugins/AdvancedVSTi/build-macos -type d -name "*.vst3" -print0 \
            | while IFS= read -r -d '' plugin; do
                cp -R "$plugin" vsti/
              done

      - name: Package portable macOS build
        run: |
          archive_output=$(./scripts/build_macos_release.sh \
            --repo-root "$GITHUB_WORKSPACE" \
            --python "${{ env.pythonLocation }}/python" \
            --release-version "${{ env.RELEASE_VERSION }}" \
            --skip-bundled-vst-build)
          archive_path=$(echo "$archive_output" | tail -1 | tr -d '[:space:]')
          if [[ -z "$archive_path" ]] || [[ ! -f "$archive_path" ]]; then
            echo "Packaging step did not produce a valid archive: $archive_path" >&2
            exit 1
          fi
          echo "ARCHIVE_PATH=$archive_path" >> "$GITHUB_ENV"

      - name: Create SHA256 checksum
        run: |
          checksum_path="${ARCHIVE_PATH}.sha256"
          shasum -a 256 "$ARCHIVE_PATH" | awk '{print $1 "  " FILENAME}' FILENAME="$(basename "$ARCHIVE_PATH")" > "$checksum_path"
          echo "CHECKSUM_PATH=$checksum_path" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Music-Studio-${{ env.RELEASE_VERSION }}-macos-x64
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.CHECKSUM_PATH }}
          if-no-files-found: error

  publish-release:
    if: github.ref_type == 'tag'
    needs: [windows-release, macos-release]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ env.RELEASE_VERSION }}"
          assets=()
          while IFS= read -r -d '' file; do
            assets+=("$file")
          done < <(find release-assets -type f -print0)

          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

          if gh release view "$tag" --json tagName > /dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --title "AI Music Studio $tag" --generate-notes
          fi
